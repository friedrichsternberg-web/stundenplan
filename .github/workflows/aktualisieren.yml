# Haelt die veroeffentlichte Seite aktuell - ohne dass Friedrichs Mac laeuft.
#
# GitHub startet diesen Auftrag nach Zeitplan, holt den Stundenplan von der
# HWR und schreibt das Ergebnis in den Zweig gh-pages. Von dort liefert
# GitHub Pages es ans Handy aus.
#
# Warum ein eigener Zweig? Damit sich Mac und Automatik nicht in die Quere
# kommen. Der Mac arbeitet auf "main" (Quellcode), die Automatik schreibt
# ausschliesslich nach "gh-pages" (Ergebnis). So kann keiner die Aenderungen
# des anderen ueberschreiben.

name: Stundenplan aktualisieren

on:
  schedule:
    # Achtung: GitHub rechnet in UTC, nicht in Berliner Zeit. Fuer diesen
    # Zweck ist das egal - geprueft wird ohnehin rund um die Uhr.
    #
    # Die krummen Minuten sind Absicht: zur vollen Stunde starten weltweit
    # alle Auftraege gleichzeitig, dann stellt GitHub sie in die Warteschlange.
    #
    # Warum viertelstuendlich, obwohl drei bis vier Laeufe am Tag genuegen?
    # Weil GitHub auf kostenlosen Repositories Zeitplan-Termine nur "nach
    # Moeglichkeit" ausfuehrt und den Grossteil verwirft. Gemessen am
    # 10./11.08.: von rund 34 geplanten Terminen liefen 6, mit Luecken von
    # drei bis fuenf Stunden. Wer haeufig plant, bekommt oefter einen Zuschlag -
    # verworfene Termine kosten nichts, weil sie gar nicht erst starten.
    - cron: "3,18,33,48 * * * *"

  # Auch bei jeder Aenderung am Quellcode. Sonst haengt die veroeffentlichte
  # Seite hinterher, bis der naechste Zeitplan-Termin greift - und der ist
  # bei GitHub nicht verlaesslich (siehe README).
  push:
    branches: [main]

  # Erlaubt, den Auftrag von Hand auszuloesen - praktisch zum Ausprobieren.
  workflow_dispatch:

# Der Auftrag muss in den Zweig gh-pages schreiben duerfen. Ohne diese
# Zeilen darf er nur lesen.
permissions:
  contents: write

# Laeuft nie zweimal gleichzeitig. Sonst koennten sich zwei Laeufe beim
# Hochladen gegenseitig abschiessen.
concurrency:
  group: stundenplan-aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Bisher veroeffentlichten Stand holen
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: veroeffentlichung

      - name: Stundenplan abgleichen
        env:
          # Sagt abgleich.py, dass es ohne Bildschirm laeuft: keine
          # macOS-Mitteilung versuchen.
          STUNDENPLAN_SERVER: "1"
          # Und wohin die Ergebnisdateien sollen.
          STUNDENPLAN_DATEN: veroeffentlichung/daten
        run: python3 abgleich.py

      - name: Seite zusammenstellen
        # Die Anzeige-Dateien koennen sich geaendert haben, wenn am
        # Quellcode gearbeitet wurde. Deshalb bei jedem Lauf mitkopieren.
        #
        # Danach bekommen app.js und style.css eine Versionsnummer an die
        # Adresse gehaengt: app.js?v=a1b2c3d4
        #
        # Warum: GitHub Pages erlaubt dem Browser, jede Datei zehn Minuten zu
        # behalten - und zwar jede fuer sich. Ohne Versionsnummer kann er die
        # neue index.html mit der alten app.js mischen. Dann sucht alter Code
        # nach neuen Bausteinen, bricht ab, und die Seite bleibt leer.
        #
        # Die Nummer ist die Kennung des Commits: sie aendert sich genau
        # dann, wenn sich am Quellcode etwas getan hat - und eben nicht bei
        # jedem Lauf, sonst gaebe es alle 30 Minuten eine neue index.html.
        run: |
          cp index.html app.js sync.js melden.js style.css symbol.png \
             manifest.json sw.js veroeffentlichung/
          VERSION="${GITHUB_SHA:0:8}"
          sed -i \
            -e "s|href=\"style.css\"|href=\"style.css?v=$VERSION\"|" \
            -e "s|src=\"app.js\"|src=\"app.js?v=$VERSION\"|" \
            -e "s|src=\"sync.js\"|src=\"sync.js?v=$VERSION\"|" \
            -e "s|src=\"melden.js\"|src=\"melden.js?v=$VERSION\"|" \
            veroeffentlichung/index.html

          # sw.js bekommt ABSICHTLICH keine Versionsnummer an die Adresse.
          # Ein Service Worker wird ueber seinen Pfad angemeldet; mit einem
          # wechselnden "?v=..." waere es bei jeder Veroeffentlichung ein
          # anderer, und der alte bliebe daneben liegen. Der Browser prueft
          # die Datei ohnehin von sich aus auf Aenderungen.

          # Dieselbe Kennung in app.js hineinschreiben und in eine winzige
          # Datei daneben. app.js vergleicht beides beim Start und laedt sich
          # neu, falls es eine aeltere Fassung ist - siehe
          # aufNeueFassungPruefen() dort.
          sed -i \
            "s|const GEBAUTE_VERSION = \"entwicklung\";|const GEBAUTE_VERSION = \"$VERSION\";|" \
            veroeffentlichung/app.js
          echo "const SEITEN_VERSION = \"$VERSION\";" > veroeffentlichung/version.js

          echo "Version der Anzeige-Dateien: $VERSION"
          grep -o 'v=[0-9a-f]*' veroeffentlichung/index.html
          grep -o 'GEBAUTE_VERSION = "[0-9a-f]*"' veroeffentlichung/app.js
          cat veroeffentlichung/version.js

          # Fehlt eine dieser Dateien, faellt es beim Benutzen kaum auf:
          # ohne sync.js gelten Notizen nur noch oertlich, ohne sw.js kommen
          # keine Benachrichtigungen mehr an. Beides sieht aus wie "geht
          # halt gerade nicht". Deshalb hier hart abbrechen, statt es
          # stillschweigend zu veroeffentlichen.
          for datei in sync.js melden.js sw.js manifest.json; do
            test -s "veroeffentlichung/$datei" \
              || { echo "$datei fehlt in der Veroeffentlichung"; exit 1; }
          done
          for tag in 'src="sync.js?v=' 'src="melden.js?v=' 'rel="manifest"'; do
            grep -q "$tag" veroeffentlichung/index.html \
              || { echo "index.html bindet $tag nicht ein"; exit 1; }
          done

      - name: Ablage wachhalten
        # Kostenlose Supabase-Projekte schlafen nach sieben ruhigen Tagen
        # ein - ausgerechnet in den Semesterferien also, wenn keiner
        # hinschaut. Dieser Aufruf zaehlt als Aktivitaet und verhindert das.
        #
        # Der Schluessel darf oeffentlich sein: er gibt fuer sich genommen
        # nichts frei, siehe Kopf von sync.js.
        #
        # "|| true": schlaegt der Aufruf fehl, ist das kein Grund, die
        # Veroeffentlichung des Stundenplans scheitern zu lassen.
        continue-on-error: true
        run: |
          SCHLUESSEL="sb_publishable_d7pxVkeMCqwhFsLrupDovA_ag2SmffE"
          curl -s -S -m 20 -o /dev/null -w "Ablage antwortet: %{http_code}\n" \
            -X POST "https://copydwpdqpnwjvknsakz.supabase.co/rest/v1/rpc/dashboard_wach" \
            -H "apikey: $SCHLUESSEL" \
            -H "Content-Type: application/json" \
            -d '{}' || true

      - name: Ergebnis hochladen
        working-directory: veroeffentlichung
        run: |
          git config user.name "Stundenplan-Automatik"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Nur committen, wenn es wirklich etwas Neues gibt. Sonst wuerde
          # bei jedem Lauf ein leerer Eintrag entstehen.
          if git diff --staged --quiet; then
            echo "Nichts Neues - kein Commit."
          else
            git commit -m "Stand vom $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
            git push
          fi

      - name: Benachrichtigung verschicken
        # Steht bewusst GANZ AM ENDE, nach dem Hochladen.
        #
        # Sonst kaeme die Mitteilung an, waehrend gh-pages noch den alten
        # Stand ausliefert - man tippt sie an und sieht den Raum von
        # gestern. Zwischen Hochladen und Ausliefern liegen bei GitHub
        # Pages ohnehin noch ein paar Sekunden, aber die halbe Minute
        # Bauzeit davor muss nicht auch noch dazukommen.
        #
        # abgleich.py legt meldung.json nur an, wenn es eine Aenderung in
        # einem BELEGTEN Fach gefunden hat. Gibt es die Datei nicht, ist
        # nichts passiert - dann auch keine Meldung.
        #
        # Das Geheimnis steht in den Repository-Secrets und nirgends im
        # Quelltext. Fehlt es, wird der Schritt uebersprungen statt zu
        # scheitern: die Veroeffentlichung des Stundenplans ist wichtiger
        # als die Mitteilung darueber.
        # !cancelled() statt success(): bricht das Hochladen ab, ist die
        # Aenderung im Stundenplan trotzdem echt und eine Meldung wert.
        # Nur bei einem abgebrochenen Lauf soll nichts rausgehen.
        if: ${{ !cancelled() }}
        env:
          MELDE_GEHEIMNIS: ${{ secrets.MELDE_GEHEIMNIS }}
        run: |
          if [ ! -f meldung.json ]; then
            echo "Keine Aenderung - nichts zu melden."
            exit 0
          fi
          if [ -z "$MELDE_GEHEIMNIS" ]; then
            echo "MELDE_GEHEIMNIS ist nicht gesetzt - Benachrichtigung uebersprungen."
            echo "Einzurichten unter: Settings -> Secrets and variables -> Actions"
            exit 0
          fi

          # Das Geheimnis in die JSON-Datei hineinreichen, ohne es in die
          # Aufrufzeile zu schreiben - die steht sonst im Protokoll.
          python3 - <<'ENDE' > versand.json
          import json, os
          meldung = json.load(open("meldung.json", encoding="utf-8"))
          meldung["geheimnis"] = os.environ["MELDE_GEHEIMNIS"]
          print(json.dumps(meldung, ensure_ascii=False))
          ENDE

          echo "Sende: $(python3 -c "import json;d=json.load(open('meldung.json'));print(d['titel'])")"
          curl -s -S -m 30 \
            -X POST "https://copydwpdqpnwjvknsakz.supabase.co/functions/v1/stundenplan-melden" \
            -H "Content-Type: application/json" \
            --data-binary @versand.json
          echo
          rm -f versand.json meldung.json
