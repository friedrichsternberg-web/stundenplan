<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EA0FF"/>
      <stop offset="0.55" stop-color="#3D6DF2"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <radialGradient id="licht" cx="0.25" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blatt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1FA"/>
    </linearGradient>
    <linearGradient id="kopf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A4E"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <filter id="schatten" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#160C5C" flood-opacity="0.38"/>
    </filter>
    <clipPath id="blattform">
      <rect x="202" y="236" width="620" height="600" rx="104"/>
    </clipPath>
  </defs>

  <!-- Hintergrund: randlos, iOS rundet selbst ab -->
  <rect width="1024" height="1024" fill="url(#grund)"/>
  <rect width="1024" height="1024" fill="url(#licht)"/>

  <!-- Das Planerblatt -->
  <g filter="url(#schatten)">
    <rect x="202" y="236" width="620" height="600" rx="104" fill="url(#blatt)"/>
  </g>
  <g clip-path="url(#blattform)">
    <rect x="202" y="236" width="620" height="150" fill="url(#kopf)"/>
  </g>

  <!-- Ringe -->
  <rect x="356" y="178" width="46" height="132" rx="23" fill="#1F2340"/>
  <rect x="622" y="178" width="46" height="132" rx="23" fill="#1F2340"/>
  <rect x="364" y="186" width="14" height="58" rx="7" fill="#FFFFFF" opacity="0.28"/>
  <rect x="630" y="186" width="14" height="58" rx="7" fill="#FFFFFF" opacity="0.28"/>

  <!-- Drei Einträge in den Wochentagsfarben -->
  <rect x="270" y="440" width="22" height="86" rx="11" fill="#0A84FF"/>
  <rect x="322" y="452" width="360" height="30" rx="15" fill="#1F2340" opacity="0.82"/>
  <rect x="322" y="498" width="230" height="20" rx="10" fill="#1F2340" opacity="0.28"/>

  <rect x="270" y="568" width="22" height="86" rx="11" fill="#AF52DE"/>
  <rect x="322" y="580" width="300" height="30" rx="15" fill="#1F2340" opacity="0.82"/>
  <rect x="322" y="626" width="190" height="20" rx="10" fill="#1F2340" opacity="0.28"/>

  <rect x="270" y="696" width="22" height="86" rx="11" fill="#30B158"/>
  <rect x="322" y="708" width="330" height="30" rx="15" fill="#1F2340" opacity="0.82"/>
  <rect x="322" y="754" width="210" height="20" rx="10" fill="#1F2340" opacity="0.28"/>
</svg>
